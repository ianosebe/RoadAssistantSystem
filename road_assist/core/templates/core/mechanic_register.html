{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<style>
    .mechanic-bg {
        background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), url('{% static "images/splash_bg.png" %}');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    /* Custom scrollbar behavior for the internal form view */
    .custom-scroll::-webkit-scrollbar {
        width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
    }
</style>

<!-- Main Mobile Container Frame -->
<div class="h-screen w-full max-w-[450px] mx-auto flex flex-col justify-between mechanic-bg shadow-2xl border-l border-r border-gray-900 px-5 py-6 overflow-y-auto custom-scroll">
    
    <!-- Top Header section -->
    <div class="w-full text-center mt-4 mb-4">
        <div class="mx-auto w-16 h-16 bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center text-white mb-3 shadow-lg border border-white/20">
            <i class="fa-solid fa-wrench text-2xl"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-white tracking-tight">Join as a Mechanic</h2>
        <p class="mt-1.5 text-sm text-gray-300">
            Already have an account? <a href="{% url 'login' %}" class="font-bold text-blue-400 hover:text-blue-300 underline transition-colors">Log in here</a>
        </p>
    </div>

    <!-- Glassmorphic Registration Form Card -->
    <div class="w-full bg-white/10 backdrop-blur-xl py-6 px-5 shadow-2xl rounded-3xl border border-white/10 mb-4">
        <form action="{% url 'register_mechanic' %}" method="POST" class="space-y-4">
            {% csrf_token %}
            
            <input type="hidden" name="role" value="mechanic">

            <div>
                <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">Your Name</label>
                <input type="text" name="name" required 
                       class="block w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-400 shadow-sm focus:ring-2 focus:ring-white/30 focus:border-white text-sm transition-all outline-none" 
                       placeholder="Ian Nyangau">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">Phone Number</label>
                <input type="text" name="phone" required 
                       class="block w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-400 shadow-sm focus:ring-2 focus:ring-white/30 focus:border-white text-sm transition-all outline-none" 
                       placeholder="e.g., +254 700 000000">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" name="email" required 
                       class="block w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-400 shadow-sm focus:ring-2 focus:ring-white/30 focus:border-white text-sm transition-all outline-none" 
                       placeholder="name@example.com">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">Password</label>
                <input type="password" name="password" required 
                       class="block w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-400 shadow-sm focus:ring-2 focus:ring-white/30 focus:border-white text-sm transition-all outline-none" 
                       placeholder="••••••••">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">Location / Region</label>
                <input type="text" name="location" required 
                       class="block w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-400 shadow-sm focus:ring-2 focus:ring-white/30 focus:border-white text-sm transition-all outline-none" 
                       placeholder="e.g., Kisii Town, Central">
            </div>

            <div class="pt-2">
                <button type="submit" 
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-gray-950 bg-blue-500 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-white transition transform active:scale-[0.97] duration-150">
                    Register as Mechanic
                </button>
            </div>
        </form>
    </div>
    
</div>
{% endblock %}
