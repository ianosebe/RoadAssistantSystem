{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>

<div class="mobile-shell bg-light pb-5">
    <div class="mobile-card">
        <!-- Sticky Header -->
        <div class="bg-white px-3 pt-4 pb-3 shadow-sm border-bottom sticky-top" style="z-index: 1020;">
            <div class="d-flex align-items-center max-w-md mx-auto">
                <a href="{% url 'fuel_delivery' %}" class="text-decoration-none text-primary fw-bold d-flex align-items-center gap-2">
                    <i class="fi fi-rr-arrow-left fs-5"></i> Back to Options
                </a>
            </div>
        </div>

        <div class="container mt-4 max-w-md">
            <!-- Dynamic Price Display -->
            <div class="bg-white p-4 rounded-4 shadow-sm border mb-4">
                <span class="badge bg-danger bg-opacity-10 text-danger mb-2">Selected Fuel</span>
                <h2 class="h5 fw-bold text-dark mb-1">{{ selected_service.name }}</h2>
                <p class="text-dark fw-bold fs-4 mb-1" id="total-price-display">$0.00</p>
                <div class="bg-light p-2 rounded-3 mt-2">
                    <p class="fs-6 text-muted fw-normal mb-1 small d-flex justify-content-between">
                        <span>Fuel Cost:</span> <span id="fuel-cost-display">$0.00</span>
                    </p>
                    <p class="fs-6 text-muted fw-normal mb-0 small d-flex justify-content-between">
                        <span>Delivery (<span id="distance-display">0.0</span> km):</span> <span id="delivery-cost-display">$0.00</span>
                    </p>
                </div>
            </div>

            <form method="POST" class="bg-white p-4 rounded-4 shadow-sm border">
                {% csrf_token %}
                
                <!-- Hidden inputs for coordinates and calculated distance -->
                <input type="hidden" id="latitude" name="latitude" value="0.0">
                <input type="hidden" id="longitude" name="longitude" value="0.0">
                <input type="hidden" id="distance" name="distance" value="0.0">
                
                <div class="mb-3">
                    <label for="vehicle_id" class="form-label fw-bold small text-muted">Select Vehicle</label>
                    <select name="vehicle_id" id="vehicle_id" class="form-select rounded-3" required>
                        <option value="" selected disabled>Choose your vehicle...</option>
                        {% for vehicle in vehicles %}
                            <option value="{{ vehicle.id }}">{{ vehicle.make }} {{ vehicle.model }} - Plate: {{ vehicle.license_plate }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label for="litres" class="form-label fw-bold small text-muted">Amount of Fuel (Litres)</label>
                    <input type="number" class="form-control rounded-3 border-primary" id="litres" name="litres" value="5" min="2" max="20" required>
                </div>

                <div class="mb-3">
                    <label for="location" class="form-label fw-bold small text-muted">Current Location</label>
                    <input type="text" class="form-control rounded-3" id="location" name="location" placeholder="Where is the vehicle parked?" required>
                </div>

                <div class="mb-4">
                    <label for="notes" class="form-label fw-bold small text-muted">Additional Notes (Optional)</label>
                    <textarea class="form-control rounded-3" id="notes" name="notes" rows="2" placeholder="e.g. Parked on the shoulder..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-3 shadow-sm">Confirm Request</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        
        // --- PRICING VARIABLES ---
        const pricePerLitre = parseFloat("{{ selected_service.price_per_litre }}");
        const baseFee = parseFloat("{{ base_fee }}");
        const perKmRate = parseFloat("{{ per_km_rate }}");
        
        // --- DISPATCH STATION COORDINATES (Set this to your mechanic's base) ---
        const STATION_LAT = -0.6766;
        const STATION_LNG = 34.7800; 

        // --- DOM ELEMENTS ---
        const litresInput = document.getElementById('litres');
        const distanceInput = document.getElementById('distance');
        
        const priceDisplay = document.getElementById('total-price-display');
        const fuelCostDisplay = document.getElementById('fuel-cost-display');
        const deliveryCostDisplay = document.getElementById('delivery-cost-display');
        const distanceDisplay = document.getElementById('distance-display');

        // --- MATH: Calculate Distance between two GPS coordinates ---
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; // Returns distance in km
        }

        // --- MATH: Update the UI ---
        function updatePricingUI(distanceKm) {
            const litres = parseFloat(litresInput.value) || 0;
            
            const fuelCost = litres * pricePerLitre;
            const deliveryCost = baseFee + (distanceKm * perKmRate);
            const total = fuelCost + deliveryCost;

            fuelCostDisplay.textContent = "$" + fuelCost.toFixed(2);
            deliveryCostDisplay.textContent = "$" + deliveryCost.toFixed(2);
            distanceDisplay.textContent = distanceKm.toFixed(1);
            priceDisplay.textContent = "$" + total.toFixed(2);
            
            // Save the calculated distance to the hidden input for Django
            distanceInput.value = distanceKm.toFixed(2);
        }

        // --- GEOLOCATION: Grab user location and run the math ---
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    document.getElementById('latitude').value = userLat;
                    document.getElementById('longitude').value = userLng;

                    // Calculate distance from station to user
                    const calculatedDistance = calculateDistance(STATION_LAT, STATION_LNG, userLat, userLng);
                    updatePricingUI(calculatedDistance);
                },
                function(error) {
                    console.warn("Geolocation failed. Defaulting to 0 km distance.", error.message);
                    updatePricingUI(0); // Failsafe if user blocks location
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            updatePricingUI(0);
        }

        // Recalculate if the user changes the Litres amount
        litresInput.addEventListener('input', function() {
            const currentDistance = parseFloat(distanceInput.value) || 0;
            updatePricingUI(currentDistance);
        });
    });
</script>
{% endblock %}
