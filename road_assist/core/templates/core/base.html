{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadAssistant</title>

    <link rel="icon" type="image/png" href="{% static 'images/favicon2.jpg' %}">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' },
                    }
                }
            }
        }
    </script>
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .mobile-shell,
        .bg-light.min-vh-100.pb-5 {
            width: min(100%, 450px);
            margin: 0 auto;
            min-height: 100vh;
            background: #f8fafc;
            position: relative;
        }
        .mobile-card {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,.12);
            overflow: hidden;
        }
        nav.mobile-nav.position-fixed.bottom-0 {
            left: 50% !important;
            transform: translateX(-50%) !important;
            width: min(100%, 450px) !important;
            max-width: 450px !important;
        }
    </style>
</head>
<body 
    style="{% block bg_image %}{% endblock %}" 
    class="min-h-screen bg-cover bg-center bg-no-repeat bg-fixed bg-gray-100"
>
    {% block content %}
    {% endblock content %}
</body>
</html>
