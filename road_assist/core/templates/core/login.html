{% extends 'core/base.html' %}

{% block content %}
<div class="flex-grow-1 bg-white p-4 p-md-5 d-flex flex-column justify-content-center position-relative min-vh-100">
    
    <a href="{% url 'splash' %}" class="position-absolute top-0 start-0 mt-4 ms-4 btn btn-light border rounded-circle d-flex align-items-center justify-content-center shadow-sm transition" style="width: 45px; height: 45px;">
        <i class="fa-solid fa-chevron-left text-secondary"></i>
    </a>

    <div class="mt-5 mb-4 text-center">
        <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3 border border-4 border-white shadow-sm" style="width: 80px; height: 80px;">
            <i class="fa-solid fa-car-side fs-3 text-primary"></i>
        </div>
        <h2 class="h2 fw-bolder text-dark mb-2">Welcome Back</h2>
        <p class="text-secondary small">Sign in to your account</p>
    </div>

    {% if messages %}
    <div class="mb-4 max-w-sm mx-auto w-100" style="max-width: 400px;">
        {% for message in messages %}
        <div class="alert d-flex align-items-center gap-2 fw-semibold border {% if message.tags == 'error' %}alert-danger border-danger{% else %}alert-success border-success{% endif %} py-3 rounded-4 shadow-sm" role="alert">
            <i class="fa-solid fa-circle-exclamation"></i>
            <div>{{ message }}</div>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}" class="w-100 max-w-sm mx-auto" style="max-width: 400px;">
        {% csrf_token %}
        
        <div class="mb-4">
            <input type="text" name="username" placeholder="Email or Phone Number" 
                class="form-control form-control-lg bg-light border-light-subtle rounded-4 py-3 px-4 shadow-sm focus-ring">
        </div>

        <div class="mb-2">
            <input type="password" name="password" placeholder="Password"
                class="form-control form-control-lg bg-light border-light-subtle rounded-4 py-3 px-4 shadow-sm focus-ring">
        </div>

        <div class="d-flex justify-content-end mb-4 mt-2">
            <a href="{% url 'forgotpassword' %}" class="text-primary text-decoration-none small fw-semibold">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-dark w-100 btn-lg rounded-4 shadow py-3 fw-bold">
            Sign In
        </button>
    </form>

</div>
{% endblock %}
