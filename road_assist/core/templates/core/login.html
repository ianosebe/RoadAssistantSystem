{% extends 'core/base.html' %}

{% block content %}
<style>
    /* Smooth press state for the mobile button */
    .mobile-btn:active {
        transform: scale(0.98);
    }
</style>

<!-- Main Mobile Container Frame -->
<div class="d-flex flex-column justify-content-center position-relative min-vh-100 mx-auto shadow-lg bg-white px-4 py-5" 
     style="max-width: 450px; width: 100%; border-left: 1px solid #dee2e6; border-right: 1px solid #dee2e6; overflow-y: auto;">
    
    <!-- Back Button -->
    <a href="{% url 'splash' %}" class="position-absolute top-0 start-0 mt-4 ms-4 btn btn-light border rounded-circle d-flex align-items-center justify-content-center shadow-sm transition" style="width: 45px; height: 45px;">
        <i class="fa-solid fa-chevron-left text-secondary"></i>
    </a>

    <!-- Header Section -->
    <div class="mt-5 mb-4 text-center">
        <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3 border border-4 border-white shadow-sm" style="width: 80px; height: 80px;">
            <i class="fa-solid fa-car-side fs-3 text-primary"></i>
        </div>
        <h2 class="h3 fw-bolder text-dark mb-1">Welcome Back</h2>
        <p class="text-secondary small">Sign in to your account</p>
    </div>

    <!-- Error/Success Alerts -->
    {% if messages %}
    <div class="mb-4 w-100 mx-auto" style="max-width: 380px;">
        {% for message in messages %}
        <div class="alert d-flex align-items-center gap-2 fw-semibold border {% if message.tags == 'error' %}alert-danger border-danger{% else %}alert-success border-success{% endif %} py-3 rounded-4 shadow-sm" role="alert">
            <i class="fa-solid fa-circle-exclamation"></i>
            <div class="small">{{ message }}</div>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST" action="{% url 'login' %}" class="w-100 mx-auto" style="max-width: 380px;">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label text-uppercase fw-bold text-secondary tracking-wider mb-1" style="font-size: 0.65rem;">Username</label>
            <input type="text" name="username" placeholder="Phone number" required
                class="form-control form-control-lg bg-light border-light-subtle rounded-4 py-2.5 px-3 fs-6 shadow-sm focus-ring">
        </div>

        <div class="mb-2">
            <label class="form-label text-uppercase fw-bold text-secondary tracking-wider mb-1" style="font-size: 0.65rem;">Password</label>
            <input type="password" name="password" placeholder="Password" required
                class="form-control form-control-lg bg-light border-light-subtle rounded-4 py-2.5 px-3 fs-6 shadow-sm focus-ring">
        </div>

        <div class="d-flex justify-content-end mb-4 mt-2">
            <a href="{% url 'forgotpassword' %}" class="text-primary text-decoration-none small fw-bold">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-dark w-100 btn-lg rounded-4 shadow py-3 fw-bold mobile-btn transition-transform fs-6">
            Sign In
        </button>
    </form>

</div>
{% endblock %}
