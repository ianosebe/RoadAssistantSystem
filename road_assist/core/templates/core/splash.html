{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<!-- Outer screen wrapper -->
<div class="min-h-screen w-full flex items-center justify-center p-0 md:py-6 md:px-4 bg-gray-900">
    
    <!-- Mobile Card Frame with Background Image Contained Inside -->
    <div class="flex flex-col items-center justify-between min-h-screen md:min-h-[82vh] w-full max-w-md px-6 py-8 md:rounded-3xl relative overflow-hidden shadow-2xl bg-cover bg-center bg-no-repeat" style="background-image: url('{% static "images/index.png" %}');">
        
        <!-- Dark Overlay so text remains crisp and readable over the image -->
        <div class="absolute inset-0 bg-black/30 backdrop-blur-[2px] z-0"></div>

        <!-- Decorative Ambient Glow Blobs -->
        <div class="absolute -top-12 -right-12 w-48 h-48 bg-white opacity-10 rounded-full blur-3xl pointer-events-none z-1"></div>
        <div class="absolute -bottom-12 -left-12 w-48 h-48 bg-blue-400 opacity-20 rounded-full blur-3xl pointer-events-none z-1"></div>

        <!-- Top Branding / Logo Section -->
        <div class="mt-10 md:mt-4 text-center z-10 w-full">
            <div class="w-20 h-20 bg-white rounded-2xl shadow-xl flex items-center justify-center mx-auto mb-4 transform rotate-3 transition-transform hover:rotate-0 duration-300">
                <i class="fa-solid fa-car-burst text-3xl text-brand-600"></i>
            </div>
            
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2 drop-shadow-md">RoadAssistant</h1>
            <p class="text-gray-200 font-light text-sm sm:text-base drop-shadow">Quick and reliable roadside assistance</p>
        </div>

        <!-- Action Buttons (Thumb-friendly bottom layout) -->
        <div class="w-full space-y-3 mb-4 z-10">
            
            <!-- Driver Button -->
            <a href="{% url 'register_driver' %}" class="flex items-center justify-between w-full py-4 px-5 bg-white/20 backdrop-blur-md border border-white/30 text-white rounded-2xl font-semibold shadow-lg hover:bg-white/30 active:scale-95 transition-all duration-200 group text-decoration-none">
                <span class="flex items-center gap-3 text-sm sm:text-base">
                    <i class="fi fi-rr-steering-wheel"></i> Continue as Driver
                </span>
                <i class="fi fi-rr-arrow-right opacity-0 group-hover:opacity-100 transition"></i>
            </a>
            
            <!-- Mechanic Button -->
            <a href="{% url 'register_mechanic' %}" class="flex items-center justify-between w-full py-4 px-5 bg-gray-900/90 backdrop-blur-md border border-gray-700 text-white rounded-2xl font-semibold shadow-lg hover:bg-black active:scale-95 transition-all duration-200 group text-decoration-none">
                <span class="flex items-center gap-3 text-sm sm:text-base">
                    <i class="fi fi-rr-wrench"></i> Continue as Mechanic
                </span>
                <i class="fi fi-rr-arrow-right opacity-0 group-hover:opacity-100 transition"></i>
            </a>
            
        </div>

    </div>
</div>
{% endblock %}
