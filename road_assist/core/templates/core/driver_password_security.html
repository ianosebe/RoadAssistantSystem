{% extends 'core/base.html' %}

{% block content %}
<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>

<style>
    .max-w-md {
        max-width: 450px !important;
        margin: 0 auto;
    }
    .form-control:focus {
        box-shadow: none;
        border-color: #0d6efd;
    }
</style>

<div class="mobile-shell bg-light pb-5">
    <div class="mobile-card">
        <div class="bg-white px-3 pt-4 pb-3 shadow-sm border-bottom sticky-top" style="z-index: 1020;">
        <div class="max-w-md d-flex align-items-center gap-3">
            <a href="{% url 'driver_settings' %}" class="text-dark text-decoration-none d-flex align-items-center">
                <i class="fi fi-rr-arrow-small-left fs-2 mb-0"></i>
            </a>
            <div>
                <h1 class="h5 fw-bold text-dark mb-0">Password & Security</h1>
            </div>
        </div>
    </div>

    <div class="container mt-4 max-w-md">

        <div class="alert alert-warning bg-warning bg-opacity-10 border-warning border-opacity-25 d-flex gap-3 rounded-4 p-3 mb-4 shadow-sm">
            <i class="fi fi-rr-shield-exclamation text-warning fs-4 mt-1"></i>
            <div>
                <h4 class="h6 fw-bold text-dark mb-1">Keep your account safe</h4>
                <p class="text-muted small mb-0">Make sure your new password is at least 8 characters long and includes a mix of letters, numbers, and symbols.</p>
            </div>
        </div>

        <form method="POST" action="">
            {% csrf_token %}
            
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4 mb-4">
                
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold text-uppercase tracking-wider" style="font-size: 0.75rem;">Current Password</label>
                    <input type="password" name="current_password" class="form-control rounded-3 py-2" placeholder="Enter your current password" required>
                </div>

                <hr class="text-muted opacity-25 mb-4">

                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold text-uppercase tracking-wider" style="font-size: 0.75rem;">New Password</label>
                    <input type="password" name="new_password" class="form-control rounded-3 py-2" placeholder="Create a new password" required>
                </div>

                <div class="mb-2">
                    <label class="form-label text-muted small fw-bold text-uppercase tracking-wider" style="font-size: 0.75rem;">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control rounded-3 py-2" placeholder="Type new password again" required>
                </div>
                
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-3 py-3 fw-bold shadow-sm mb-4">
                Update Password
            </button>
        </form>

    </div>
</div>
{% endblock %}
