{% extends 'core/base.html' %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-screen w-full bg-gray-50 px-6 py-12">
    <div class="w-full max-w-md bg-white border border-gray-100 rounded-3xl shadow-xl p-8 text-center z-10">
        
        <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 border border-emerald-100 shadow-sm">
            <i class="fa-solid fa-lock-open text-3xl"></i>
        </div>

        <h2 class="text-2xl font-extrabold text-gray-900 mb-2 tracking-tight">Password Updated!</h2>
        <p class="text-gray-500 text-sm leading-relaxed mb-8">Your new password has been successfully saved. You can now securely log back into your RoadAssistant account.</p>

        <a href="{% url 'login' %}" class="flex items-center justify-center w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-semibold shadow-md transition duration-300 text-decoration-none">
            Sign In Now
        </a>
    </div>
</div>
{% endblock %}
