<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Road Assistant System</title>
    <style>
        /* Base page styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        /* The white card */
        .reset-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
        }

        /* Header section */
        .reset-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .reset-header h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .reset-header p {
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Helpful info box */
        .info-box {
            background-color: #e8f4fd;
            color: #1b6a9e;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 25px;
            border-left: 4px solid #3498db;
            line-height: 1.4;
        }

        /* Form inputs */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #34495e;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        /* Submit Button */
        .reset-btn {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 5px;
        }
        .reset-btn:hover {
            background-color: #2980b9;
        }

        /* Bottom links */
        .footer-links {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }
        .footer-links a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .footer-links a:hover {
            text-decoration: underline;
            color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="reset-container">
        <div class="reset-header">
            <h1>Forgot Password?</h1>
            <p>Enter the email address associated with your account, and we'll send you a secure link to reset your password.</p>
        </div>

        <div class="info-box">
            If you don't receive an email within a few minutes, please check your spam or junk folder.
        </div>
        
        <form method="POST" action="{% url 'forgotpassword' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="e.g., driver@example.com" required>
            </div>
            
            <button type="submit" class="reset-btn">Send Reset Link</button>
        </form>
        
        <div class="footer-links">
            <p>Remember your password? <a href="/login/">Back to Login</a></p>
        </div>
    </div>

</body>
</html>
