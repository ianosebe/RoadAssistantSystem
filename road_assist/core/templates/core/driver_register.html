{% extends 'core/base.html' %}
{% block content %}

<!-- Main Mobile Container Frame -->
<div class="h-screen w-full max-w-[450px] mx-auto flex flex-col justify-center bg-gray-50 shadow-2xl overflow-y-auto border-l border-r border-gray-200 driver-bg px-4 py-6">
    
    <!-- Top Header section -->
    <div class="w-full text-center mb-6">
        <div class="mx-auto w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 mb-3 shadow-sm">
            <i class="fa-solid fa-car text-3xl"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">Create a Driver Account</h2>
        <p class="mt-1.5 text-sm text-gray-600">
            Already have an account? <a href="{% url 'login' %}" class="font-bold text-blue-600 hover:text-blue-500 transition-colors">Sign in</a>
        </p>
    </div>

    <!-- Error/Success Messages Block -->
    {% if messages %}
    <div class="w-full mb-4 space-y-2">
        {% for message in messages %}
            <div class="p-3 rounded-xl text-sm font-semibold {% if message.tags == 'error' %}bg-red-100 text-red-700 border border-red-200{% else %}bg-green-100 text-green-700 border border-green-200{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Registration Form Card -->
    <div class="w-full bg-white py-6 px-5 shadow-xl rounded-3xl border border-gray-100/80 backdrop-blur-sm bg-white/95">
        <form action="{% url 'register_driver' %}" method="POST" class="space-y-4">
            {% csrf_token %}
            
            <input type="hidden" name="role" value="driver">

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">First Name</label>
                <!-- CHANGED: name="first_name" matches the database constraint directly -->
                <input type="text" name="first_name" required class="block w-full px-4 py-2.5 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 text-sm transition-all outline-none placeholder-gray-400" placeholder="John">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Phone Number</label>
                <input type="text" name="phone" required class="block w-full px-4 py-2.5 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 text-sm transition-all outline-none placeholder-gray-400" placeholder="e.g., +254 700 000000">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" name="email" required class="block w-full px-4 py-2.5 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 text-sm transition-all outline-none placeholder-gray-400" placeholder="name@example.com">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Password</label>
                <input type="password" name="password" required class="block w-full px-4 py-2.5 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 text-sm transition-all outline-none placeholder-gray-400" placeholder="••••••••">
            </div>

            <div class="pt-2">
                <button type="submit" class="mobile-btn w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition transform active:scale-95 duration-150">
                    Register Account
                </button>
            </div>
        </form>
    </div>
    
</div>

{% endblock %}
