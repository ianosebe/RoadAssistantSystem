{% extends 'core/base.html' %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-screen w-full bg-gray-50 px-6 py-12">
    <div class="w-full max-w-md bg-white border border-gray-100 rounded-3xl shadow-xl p-8 z-10">
        
        <h2 class="text-2xl font-extrabold text-gray-900 mb-2 tracking-tight text-center">Set New Password</h2>
        <p class="text-gray-500 text-sm text-center mb-6">Please enter and confirm your new secure password below.</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">{{ field.label }}</label>
                    
                    <div class="relative w-full">
                        {{ field }}
                        
                        <button type="button" class="toggle-password absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-blue-600 transition focus:outline-none">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>

                    {% if field.errors %}
                        <p class="text-xs text-red-500 mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="w-full py-4 mt-4 bg-gray-900 hover:bg-black text-white rounded-2xl font-semibold shadow-md transition duration-300">
                Reset My Password
            </button>
        </form>
    </div>
</div>

<style>
    form input {
        width: 100%;
        /* Increased right padding (2.5rem) so text doesn't hide behind the eye icon */
        padding: 0.85rem 2.5rem 0.85rem 1rem; 
        border: 1px solid #e5e7eb;
        border-radius: 1rem;
        font-size: 0.875rem;
        outline: none;
        transition: all 0.2s;
    }
    form input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Grab all the toggle buttons on the page
        const toggleButtons = document.querySelectorAll('.toggle-password');
        
        toggleButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Find the specific input field next to the clicked button
                const input = this.previousElementSibling;
                const icon = this.querySelector('i');
                
                // Toggle between 'password' and 'text' types
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash'); // Change to slashed eye
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye'); // Change back to normal eye
                }
            });
        });
    });
</script>
{% endblock %}
