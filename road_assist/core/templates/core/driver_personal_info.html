{% extends 'core/base.html' %}

{% block content %}
<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>

<style>
    .max-w-md {
        max-width: 450px !important;
        margin: 0 auto;
    }
    .form-control:focus {
        box-shadow: none;
        border-color: #0d6efd;
    }
</style>

<div class="d-flex flex-column position-relative mx-auto shadow-lg min-vh-100 bg-light" style="width: 100%; max-width: 450px; border-left: 1px solid #dee2e6; border-right: 1px solid #dee2e6;">
<!-- Top Navigation Header -->
        <div class="d-flex align-items-center gap-3 mb-4">
            {% if request.user.mechanicprofile %}
                <a href="{% url 'mechanic_profile' %}" class="btn btn-light border rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 40px; height: 40px;">
                    <i class="fa-solid fa-arrow-left text-secondary"></i>
                </a>
            {% else %}
                <a href="{% url 'driver_settings' %}" class="btn btn-light border rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 40px; height: 40px;">
                    <i class="fa-solid fa-arrow-left text-secondary"></i>
                </a>
            {% endif %}

            <div>
                <h5 class="fw-bolder text-dark mb-0">Personal Information</h5>
                <p class="text-muted small mb-0" style="font-size: 0.75rem;">Manage your account details</p>
            </div>
        </div>

    <div class="container mt-4 max-w-md">

        <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold shadow-sm mx-auto mb-2" style="width: 80px; height: 80px; font-size: 2rem;">
                {{ request.user.first_name|slice:":1"|upper }}{{ request.user.last_name|slice:":1"|upper }}
            </div>
            <button class="btn btn-sm btn-link text-decoration-none fw-semibold">Change Photo</button>
        </div>

        <form method="POST" action="">
            {% csrf_token %}
            
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4 mb-4">
                
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold text-uppercase tracking-wider" style="font-size: 0.75rem;">First Name</label>
                    <input type="text" name="first_name" class="form-control rounded-3 py-2" value="{{ request.user.first_name }}">
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold text-uppercase tracking-wider" style="font-size: 0.75rem;">Last Name</label>
                    <input type="text" name="last_name" class="form-control rounded-3 py-2" value="">
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold text-uppercase tracking-wider" style="font-size: 0.75rem;">Email Address</label>
                    <input type="email" class="form-control rounded-3 py-2 bg-light text-muted" value="{{ request.user.email }}" disabled>
                </div>

                <div class="mb-2">
                    <label class="form-label text-muted small fw-bold text-uppercase tracking-wider" style="font-size: 0.75rem;">Phone Number</label>
                    <input type="tel" name="phone_number" class="form-control rounded-3 py-2" value="{{ request.user.phone_number }}" disabled>
                </div>
                
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-3 py-3 fw-bold shadow-sm mb-4">
                Save Changes
            </button>
        </form>

    </div>
</div>
{% endblock %}
